# One-command local run:  docker compose up --build
# Then open http://localhost:3001
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seminary
      POSTGRES_PASSWORD: seminary_dev
      POSTGRES_DB: seminary
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seminary -d seminary"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://seminary:seminary_dev@db:5432/seminary
      JWT_SECRET: change-me-in-production
      # Needed only for the Scan Application feature:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
